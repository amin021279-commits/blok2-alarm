name: Alarm Blok2Candle M5

on:
  schedule:
    - cron: "*/10 * * * 0-5"    # cadangan tiap 10 menit (Minggu-Jumat UTC); pemicu utama = cron-job.org
  workflow_dispatch:             # dipanggil cron-job.org tiap candle M5 close + tombol "Run workflow"

permissions:
  contents: write                # untuk menyimpan state.json (cegah alarm dobel)

concurrency:
  group: blok2
  cancel-in-progress: false

jobs:
  cek:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Cek pola Blok2Candle
        run: python blok2_alert.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
      - name: Simpan state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "blok2-bot"
            git config user.email "blok2-bot@users.noreply.github.com"
            git add state.json
            git commit -m "state alarm"
            git push
          fi
